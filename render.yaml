services:
  - type: web
    name: agent-shopee
    runtime: python
    plan: free # dữ liệu nằm ở Postgres (Neon) nên không cần disk
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PG_DSN
        sync: false
      - key: APP_USER
        value: admin
      - key: APP_PASSWORD
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: COMMANDCODE_API_KEY
        sync: false
